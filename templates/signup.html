<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body> 

    <div class="logo">
        <img src="/static/images/logo.png" alt="Logo">
    </div>
    <div class="container">
        <!--<form id="signup-form">-->
        <form action="signup-form" method="post"></form>
            <h2>Sign Up</h2>
            <input type="text" id="name" name="name" placeholder="Name" required>
            <input type="text" id="surname" name="surname" placeholder="Surname" required>
            <input type="text" id="student-number" name="student-number" placeholder="Student Number" required>
            <select name="Faculty" required>
                <option value="">Select Facalty</option>
                <option value="Agric">Faculty of Agriculture and Natural Sciences</option>
                <option value="Edu">Faculty of Education</option>
                <option value="Manage">Faculty of Economics, Development and Business Management </option>
            </select>
                <select name="Course" required>
                    <option value="">Select a Course</option>
                    <option value="CS">PRJ400</option>
                    <option value="Robotics">HCI400</option>
                    <option value="Data">Data </option>
                    <option value="Algorithms">RESEARCH</option>
                    <option value="AI">Artificial </option>
                    <option value="ML">ADS</option>
                    <option value="DL">Deep Learning</option>
                    <option value="CV">CYBER</option>
                    <option value="NLP">Natural </option>
                    <option value="BD">Big Data</option>
                    <option value="DS">Data Science</option>
                </select>
            <input type="number" id="year-of-study" name="year-of-study" placeholder="Year of Study" required>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <h5>Capture your face,make it visible enough</h5>
            <div id="my_camera"></div>
            <button onClick="takeSnapshot()">Capture Photo</button>
            <div id="results"></div>
            <div class="video-container">
                <video id="videoElement" width="40" height="180" autoplay></video>
                <!--<iframe id="video" src="/video_feed"></iframe>-->
            </div>
            <button type="submit">Sign Up</button>
            <p><a href="index.html">Login</a></p>
        </form>

    </div>
    <script src="/static/js/scripts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/webcamjs/1.0.26/webcam.min.js"></script>
    <div id="signupError"></div>
</body>
</html>
